name: Validate theme
on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  validate-theme:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # CI auth is ONLY these two vars (cmslib nativeHubSpotEnv).
      # Local .env hub_* keys are never used in Actions.
      HUBSPOT_PORTAL_ID: ${{ secrets.HUBSPOT_CI_PORTAL_ID }}
      HUBSPOT_PERSONAL_ACCESS_KEY: ${{ secrets.HUBSPOT_CI_PERSONAL_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      - run: npm ci

      - name: Use unique CI theme path
        run: node scripts/ci-theme-path.js rename

      - name: Upload theme to CI account
        run: npm run ciUpload

      - name: Marketplace validation
        run: npm run validate

      - name: Lighthouse test
        run: npm run lighthouse

      - name: Delete ephemeral CI theme path
        if: always() && env.CI_THEME_PATH != ''
        run: node scripts/ci-theme-path.js delete

      - name: PKG versions
        run: |
          node -v
          npm -v
